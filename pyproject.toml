[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoprepml"
version = "1.5.0"
description = "Multi-modal Python preprocessing and EDA toolkit for tabular, text, time-series, graph, and image data"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "MD Shoaibuddin Chanda", email = "mdshoaibuddinchanda@gmail.com"}
]
keywords = ["machine-learning", "data-preprocessing", "data-cleaning", "automl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pandas>=2.2.3,<3; python_version < '3.14'",
    "pandas>=3.0.0,<4; python_version >= '3.14'",
    "numpy>=1.26.4,<3",
    "joblib>=1.3,<2",
    "scikit-learn>=1.6.1,<1.7; python_version < '3.10'",
    "scikit-learn>=1.7.2,<2; python_version >= '3.10'",
    "matplotlib>=3.9.0,<4; python_version < '3.10'",
    "matplotlib>=3.10.7,<4; python_version >= '3.10'",
    "seaborn>=0.13.2,<1",
    "jinja2>=3.1.6,<4",
    "pyyaml>=6.0.3,<7",
    "imbalanced-learn>=0.12.4,<0.13; python_version < '3.10'",
    "imbalanced-learn>=0.14.2,<0.15; python_version >= '3.10'",
    "Pillow>=10.0.0,<13",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "hypothesis>=6.100,<7",
    "mypy>=1.11,<2",
    "black==24.10.0",
    "ruff==0.8.4; python_version < '3.14'",
    "ruff>=0.16.0,<0.17; python_version >= '3.14'",
]
docs = [
    "mkdocs>=1.4.0",
    "mkdocs-material>=8.0.0",
]
llm = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-genai>=1.0.0",
    "ollama>=0.1.0",
]
viz = [
    "plotly>=5.0.0",
    "streamlit>=1.0.0",
]
storage = [
    "fsspec>=2024.0.0",
]
tracking = [
    "mlflow>=2.10.0",
]
notebooks = [
    "jupyterlab>=4.0",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]
all = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "hypothesis>=6.100,<7",
    "mypy>=1.11,<2",
    "black==24.10.0",
    "ruff==0.8.4; python_version < '3.14'",
    "ruff>=0.16.0,<0.17; python_version >= '3.14'",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-genai>=1.0.0",
    "ollama>=0.1.0",
    "plotly>=5.0.0",
    "streamlit>=1.0.0",
    "jupyterlab>=4.0",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    "fsspec>=2024.0.0",
    "mlflow>=2.10.0",
    "mkdocs>=1.4.0",
    "mkdocs-material>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/mdshoaibuddinchanda/autoprepml"
Documentation = "https://autoprepml.readthedocs.io"
Repository = "https://github.com/mdshoaibuddinchanda/autoprepml"
"Bug Tracker" = "https://github.com/mdshoaibuddinchanda/autoprepml/issues"

[project.scripts]
autoprepml = "autoprepml.cli:main"
autoprepml-config = "autoprepml.cli_config:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autoprepml*"]
exclude = ["tests*", "docs*", "examples*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--verbose --tb=short"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
branch = true
source = ["autoprepml"]

[tool.coverage.report]
show_missing = true

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py39"
