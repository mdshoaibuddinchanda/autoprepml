name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "autoprepml/**"
      - "tests/**"
      - "examples/**"
      - "docs/**"
      - "scripts/**"
      - "assets/**"
      - "setup.py"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "autoprepml/**"
      - "tests/**"
      - "examples/**"
      - "docs/**"
      - "scripts/**"
      - "assets/**"
      - "setup.py"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install quality tools
        run: python -m pip install "ruff==0.8.4" "black==24.10.0"

      - name: Run Ruff
        run: ruff check autoprepml tests examples

      - name: Check Black formatting
        run: black --check autoprepml tests examples

  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: quality
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,viz,llm]"

      - name: Run tests with coverage
        run: >-
          python -m pytest tests -q
          --cov=autoprepml
          --cov-report=xml
          --cov-report=term-missing
          --cov-fail-under=75
          --junitxml=pytest.xml
          --tb=short

      - name: Verify installed dependency graph
        run: python -m pip check

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}-${{ github.run_id }}
          path: |
            pytest.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 14

  optional:
    name: Optional integrations
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install optional dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,viz,llm]"

      - name: Verify provider imports
        run: >-
          python -c
          "import anthropic, google.genai, ollama, openai, plotly, streamlit;
          import autoprepml;
          print('optional integrations import successfully')"

      - name: Run optional integration tests
        run: >-
          python -m pytest
          tests/test_llm_integration.py
          tests/test_llm_suggest.py
          -q --tb=short

  security:
    name: Security audit
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install security tools
        run: python -m pip install "bandit==1.8.6" "pip-audit==2.9.0"

      - name: Run Bandit
        run: bandit -q -r autoprepml

      - name: Audit runtime dependencies
        run: pip-audit --strict -r requirements.txt

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs]"

      - name: Build docs with strict link checking
        run: bash scripts/build_docs.sh

  package:
    name: Build and smoke-test package
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Install wheel in clean target
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install dist/*.whl
          wheel-smoke/bin/python -c "import autoprepml; print(autoprepml.__version__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: distributions-${{ github.sha }}
          path: dist/
          retention-days: 14
