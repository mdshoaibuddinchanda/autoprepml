name: CI

on:
  push:
    branches: [main, develop, v1.5-development]
    paths:
      - "autoprepml/**"
      - "tests/**"
      - "examples/**"
      - "creator_examples/**"
      - "docs/**"
      - "scripts/**"
      - "setup.py"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
    branches: [main, develop, v1.5-development]
    paths:
      - "autoprepml/**"
      - "tests/**"
      - "examples/**"
      - "creator_examples/**"
      - "docs/**"
      - "scripts/**"
      - "setup.py"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install quality tools
        run: python -m pip install "ruff==0.8.4" "black==24.10.0"

      - name: Run Ruff
        run: ruff check autoprepml tests examples creator_examples --exclude '*.ipynb'

      - name: Check Black formatting
        run: black --check autoprepml tests examples creator_examples

  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: quality
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,viz,llm]"

      - name: Run tests with coverage
        run: >-
          python -m pytest tests -q
          --cov=autoprepml
          --cov-report=xml
          --cov-report=term-missing
          --cov-fail-under=75
          --junitxml=pytest.xml
          --tb=short

      - name: Publish test failure summary
        if: failure()
        shell: python {0}
        run: |
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("pytest.xml")
          messages = []
          if report.exists():
              root = ET.parse(report).getroot()
              for case in root.findall(".//testcase"):
                  problem = case.find("failure")
                  if problem is None:
                      problem = case.find("error")
                  if problem is not None:
                      detail = " ".join((problem.text or "").split())
                      messages.append(
                          f"{case.attrib.get('classname', '')}.{case.attrib.get('name', '')}: "
                          f"{detail[:400]}"
                      )
              for problem in root.findall("./errors/error"):
                  messages.append("test session error: " + " ".join((problem.text or "").split())[:400])

          if not messages:
              messages.append("pytest exited with a failure; pytest.xml contained no details")

          summary = "\n".join(messages)
          print("::error title=pytest failures::" + summary.replace("\n", " | "))
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as stream:
                  stream.write("### Pytest failures\n\n")
                  stream.write("\n".join(f"- {message}" for message in messages))
                  stream.write("\n")

      - name: Verify installed dependency graph
        run: python -m pip check

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}-${{ github.run_id }}
          path: |
            pytest.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 14

  optional:
    name: Optional integrations
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install optional dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,viz,llm]"

      - name: Verify provider imports
        run: >-
          python -c
          "import anthropic, google.genai, ollama, openai, plotly, streamlit;
          import autoprepml;
          print('optional integrations import successfully')"

      - name: Run optional integration tests
        run: >-
          python -m pytest
          tests/test_llm_integration.py
          tests/test_llm_suggest.py
          -q --tb=short

  security:
    name: Security audit
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install security tools
        run: python -m pip install "bandit==1.8.6" "pip-audit==2.9.0"

      - name: Run Bandit
        run: bandit -q -r autoprepml

      - name: Audit runtime dependencies
        run: pip-audit --strict -r requirements.txt

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs]"

      - name: Build docs with strict link checking
        run: bash scripts/build_docs.sh

      - name: Validate Python documentation snippet syntax
        run: python scripts/validate_docs_examples.py

  notebooks:
    name: Execute maintained notebooks
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install notebook dependencies
        run: python -m pip install -e ".[notebooks]"

      - name: Execute maintained notebooks
        run: python scripts/validate_notebooks.py

  package:
    name: Build and smoke-test package
    runs-on: ubuntu-latest
    needs: [test, notebooks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Install wheel in clean target
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install dist/*.whl
          wheel-smoke/bin/python -c "import autoprepml; print(autoprepml.__version__)"
          wheel-smoke/bin/python -m autoprepml.cli --help

      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: distributions-${{ github.sha }}
          path: dist/
          retention-days: 14
