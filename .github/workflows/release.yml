name: Release package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              version = tomllib.load(stream)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if tag != version:
              raise SystemExit(f"Tag {tag} does not match package version {version}")
          PY

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Verify distribution contents
        shell: python
        run: |
          import glob
          import tarfile
          import zipfile

          forbidden = (".coverage", "coverage.xml", "pytest.xml", ".env", ".git/")
          for path in glob.glob("dist/*"):
              if path.endswith(".whl"):
                  with zipfile.ZipFile(path) as archive:
                      names = archive.namelist()
              else:
                  with tarfile.open(path, "r:gz") as archive:
                      names = archive.getnames()
              bad = [name for name in names if any(token in name for token in forbidden)]
              if bad:
                  raise SystemExit(f"Forbidden files in {path}: {bad}")

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "AutoPrepML $GITHUB_REF_NAME"
